name: Test and Check

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-24.04
    environment: ci

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Read Bun version
        id: bun-version
        run: echo "version=$(cat .bun-version)" >> "$GITHUB_OUTPUT"

      - name: Set up Bun
        uses: oven-sh/setup-bun@f4d14e03ff726c06358e5557344e1da148b56cf7 # v1
        with:
          bun-version: ${{ steps.bun-version.outputs.version }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Anvil for storage integration
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: v1.7.1

      - name: Run storage-label integration tests
        run: bun test tests/rpc-simulation.integration.test.ts tests/storage-labels.integration.test.ts tests/mapping-storage.integration.test.ts tests/state-change-extraction.test.ts tests/abi-provider-fallback.test.ts

      - name: Install Redis for managed-access integration
        run: sudo apt-get update && sudo apt-get install -y redis-server

      - name: Verify managed access with Redis and Anvil
        run: bun test tests/managed-access.integration.test.ts

      - name: Run checks tests
        run: cd checks && bun test
        env:
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          QUICKNODE_RPC_URL: ${{ secrets.QUICKNODE_RPC_URL }}
          ARC_RPC_URL: ${{ secrets.ARC_RPC_URL }}
          ROBINHOOD_RPC_URL: ${{ secrets.ROBINHOOD_RPC_URL }}
          OPTIMISM_RPC_URL: ${{ secrets.OPTIMISM_RPC_URL }}
          BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
          UNICHAIN_RPC_URL: ${{ secrets.UNICHAIN_RPC_URL }}
          INK_RPC_URL: ${{ secrets.INK_RPC_URL }}
          SONEIUM_RPC_URL: ${{ secrets.SONEIUM_RPC_URL }}
          BOB_RPC_URL: ${{ secrets.BOB_RPC_URL }}
          BSC_RPC_URL: ${{ secrets.BSC_RPC_URL }}
          CELO_RPC_URL: ${{ secrets.CELO_RPC_URL }}
          POLYGON_RPC_URL: ${{ secrets.POLYGON_RPC_URL }}
          AVALANCHE_RPC_URL: ${{ secrets.AVALANCHE_RPC_URL }}
          MONAD_RPC_URL: ${{ secrets.MONAD_RPC_URL }}
          MEGAETH_RPC_URL: ${{ secrets.MEGAETH_RPC_URL }}
          WORLDCHAIN_RPC_URL: ${{ secrets.WORLDCHAIN_RPC_URL }}
          ZORA_RPC_URL: ${{ secrets.ZORA_RPC_URL }}
          XLAYER_RPC_URL: ${{ secrets.XLAYER_RPC_URL }}
          ARBITRUM_RPC_URL: ${{ secrets.ARBITRUM_RPC_URL }}
          TEMPO_RPC_URL: ${{ secrets.TEMPO_RPC_URL }}
          CHECKS_GLOBAL_TIMEOUT_MS: '60000'
          CHECK_TIMEOUT_MS: '15000'
          DAO_NAME: 'Uniswap'
          GOVERNOR_ADDRESS: '0x408ED6354d4973f66138C91495F2f2FCbd8724C3'

  check:
    name: Run Type Check
    runs-on: ubuntu-24.04
    environment: ci

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Read Bun version
        id: bun-version
        run: echo "version=$(cat .bun-version)" >> "$GITHUB_OUTPUT"

      - name: Set up Bun
        uses: oven-sh/setup-bun@f4d14e03ff726c06358e5557344e1da148b56cf7 # v1
        with:
          bun-version: ${{ steps.bun-version.outputs.version }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run JSON contract check
        run: bun run contract:check

      - name: Run type check
        run: bun run check

  frontend:
    name: Run Frontend Check and Build
    runs-on: ubuntu-24.04
    environment: ci

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Read Bun version
        id: bun-version
        run: echo "version=$(cat .bun-version)" >> "$GITHUB_OUTPUT"

      - name: Set up Bun
        uses: oven-sh/setup-bun@f4d14e03ff726c06358e5557344e1da148b56cf7 # v1
        with:
          bun-version: ${{ steps.bun-version.outputs.version }}

      - name: Install frontend dependencies
        run: cd frontend && bun install --frozen-lockfile

      - name: Run frontend check
        run: cd frontend && bun run check

      - name: Run frontend build
        run: cd frontend && bun run build

  frontend-isolated:
    name: Run Frontend Build (Isolated Deploy Context)
    runs-on: ubuntu-24.04
    environment: ci

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Read Bun version
        id: bun-version
        run: echo "version=$(cat .bun-version)" >> "$GITHUB_OUTPUT"

      - name: Set up Bun
        uses: oven-sh/setup-bun@f4d14e03ff726c06358e5557344e1da148b56cf7 # v1
        with:
          bun-version: ${{ steps.bun-version.outputs.version }}

      - name: Run frontend build in isolated deployment context
        run: |
          temp_dir="$(mktemp -d)"
          git archive --format=tar HEAD frontend | tar -xf - -C "$temp_dir"
          cd "$temp_dir/frontend"
          bun install --frozen-lockfile
          bun run build
